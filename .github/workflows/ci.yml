name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm via Corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm --filter @proofbridge/web exec playwright install --with-deps chromium
      - name: E2E smoke (§3 hero workflow, reload, offline, backup restore, consent/egress, i18n, PDF)
        run: pnpm --filter @proofbridge/web e2e
      - name: E2E extension (no passive capture, hostile pages, capture → import)
        run: pnpm --filter @proofbridge/extension e2e
      - name: Upload loadable extension build (unpacked, production manifest)
        uses: actions/upload-artifact@v4
        with:
          name: proofbridge-extension-chrome-mv3
          path: apps/extension/.output/chrome-mv3
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/extension/playwright-report
          retention-days: 7
